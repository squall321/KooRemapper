# C++ 회귀 가드 — 빌드 후 tools/regress 전체와 help 사례를 실제 바이너리로 돌린다(수동 전용이었다).
name: regress

on:
  push:
  pull_request:

jobs:
  cpp-regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠ gmsh 를 반드시 깐다. 2026-09-25 부터 `meshfix` 관련 두 시험은 gmsh 가 없으면
      # **skip 이 아니라 FAIL** 이다(0704b79·2e47878). 그 skip 안에 실제 결함이 숨어 있었고
      # 실사용 박스가 우리보다 먼저 찾아 돌려줬다 — 조용히 건너뛰는 길을 없앤 것이 그 수정이다.
      # 그래서 CI 에도 gmsh 가 있어야 한다. meshfix 가 쓰는 .geo 기능(Merge · ClassifySurfaces ·
      # CreateGeometry · Surface{:})은 gmsh 4.0+ 이면 된다.
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libomp-dev gmsh

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # 이 잡에서 유일하게 오래 걸리는 단계다(전체 소스 컴파일, 수 분).
      # 시험 자체는 gmsh 없이 1초, gmsh 가 있어도 20초 안쪽이다.
      - name: Build (long — full compile)
        run: cmake --build build --config Release -j$(nproc)

      - name: Unit tests
        run: ./build/bin/KooRemapper_tests

      # help 의 matdb 사례는 database 를 SIF 경로(/opt/kooremapper/...)로 가리키지만,
      # run_help_examples.py 가 실행 전에 그 앞부분을 '<바이너리의 조부모>/' 로 바꿔 쓴다.
      # 즉 /opt 가 아니라 build/materials/material_db.json 을 읽으므로 그 자리에 둔다.
      # (CMake 는 materials 를 build/bin/materials 에 놓아 조부모 자리에는 없다.)
      - name: Stage bundled material DB (for the matdb help example)
        run: cp -r dist/materials build/

      # gmsh 는 **경로를 고정해** 넘긴다. PATH 탐색에 맡기면 어떤 gmsh 를 집었는지에 따라
      # 결과가 갈린다 — 이 리포에서 실제로 그랬다(개발 박스의 `~/.local/bin/gmsh` 는 깨진
      # 파이썬 래퍼라 meshfix 가 rc=1 로 죽는다).
      #
      # `KOOREMAPPER_TEST_GMSH` 는 **일부러 안 준다.** 그것을 주면 `test_gmsh_discovery.py` 가
      # 플랫폼 배치(bin/gmsh/gmsh.exe 심볼릭 링크)까지 돌게 되는데, 그 시험은 지금 스스로
      # '없으면 건너뛴다' 를 선언해 둔 상태다. 여기서 같이 켜면 이 변경의 범위를 넘고 새 실패
      # 갈래가 생긴다 — 켜고 싶으면 그것만 따로 판단한다.
      - name: Regression suite (tools/regress)
        env:
          KOOREMAPPER_GMSH: /usr/bin/gmsh
        run: |
          echo "gmsh: $(command -v gmsh || echo 'MISSING') — $(gmsh --version 2>&1 | head -1)"
          fail=0
          for t in tools/regress/*.py; do
            echo "::group::$t"
            if python3 "$t" build/bin/KooRemapper; then
              echo "-> OK"
            else
              echo "-> FAIL"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Help examples
        run: python3 tools/help/run_help_examples.py build/bin/KooRemapper
