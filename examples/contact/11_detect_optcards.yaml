# 11_detect_optcards.yaml — detect + 세부 옵션 (Card A~C)
# auto_create로 생성되는 접촉에 Optional Cards를 전부 지정할 수 있다.
model:  model.k
output: 11_detect_optcards_result.k

contacts:
  - action: detect
    scope: all
    tolerance: 0.1
    auto_create: true
    contact_type: auto
    # Card 2
    friction: 0.15
    fd: 0.10
    # Card A
    soft: 2
    sofscl: 0.1
    depth: 35
    sbopt: 3
    # Card B
    penmax: 0.5
    thkopt: 1
    shlthk: 1
    # Card C
    igap: 2
    ignore: 1
