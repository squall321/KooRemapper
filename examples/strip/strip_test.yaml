# Strip command example
# Remove bulky mesh data keywords, keep only options/controls
# 입력 먼저: KooRemapper assemble examples/assemble_display/gen_al_box.yaml   (→ al_box.k, 약 120MB 라 저장소에 두지 않음)
model: ../assemble_display/al_box.k
output: stripped_output.k
keywords:
  - "*NODE"
  - "*ELEMENT_SOLID"
  - "*ELEMENT_SHELL"
  - "*INITIAL_STRESS_SOLID"
  - "*INITIAL_STRESS_SHELL"
