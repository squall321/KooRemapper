        thickness: 0.030
        num_elements: 2
        material_card: |
          *MAT_ELASTIC_TITLE
          Panel-F
          $#     mid        ro         e        pr        da        db  not used
                   4 1.420E-09 3.300E+03 2.500E-01       0.0       0.0       0.0
      # 6. PSA4 (0.025 mm) 1ea solid  [was shell in b7_mixed]
      - title: PSA4_ADV
        thickness: 0.025
        num_elements: 1
        element_type: solid
        material_card: |
          *MAT_GENERAL_VISCOELASTIC_TITLE
