           1.500E+01 1.000E+02 2.500E+02 1.000E+02
           4.000E+01 1.000E+03 4.500E+02 1.000E+03
           1.000E+02 1.000E+04 3.500E+02 1.000E+04
      # 9. BarrierPI (0.025 mm) 1ea solid
      - title: BarrierPI
        thickness: 0.025
        num_elements: 1
        element_type: solid
        material_card: |
          *MAT_ELASTIC_TITLE
          BarrierPI
          $#     mid        ro         e        pr        da        db  not used
                   6 1.400E-09 3.000E+03 3.400E-01       0.0       0.0       0.0
      # 10. PSA6 (0.016 mm) 1ea solid
      - title: PSA6_ADV
        thickness: 0.016
