# ex02_stress_kfile_material.yaml
# 모드: 응력 (기본) — K-파일에 *MAT_ELASTIC 등 재료 포함
#
# 상황: K-파일에 이미 *MAT 카드가 있을 때
#       material: 섹션 생략 가능 — K-파일 재료를 파트별로 자동 사용
#
# K-파일 예시:
#   *MAT_ELASTIC
#   $#     mid        ro         e        pr
#            1  7.85e-09  210000.0       0.3
#   *PART
#   Inner block
#            1         1         1
#
# 출력:
#   output_s2.k      압착된 메시 + *INCLUDE output_s2.dynain
#   output_s2.dynain *INITIAL_STRESS_SOLID (파트별 재료 사용)

parts:
  - pid: 1
    eps_x: -0.015
    eps_y: -0.015
    eps_z:  0.0

  - pid: 2
    eps_x: -0.010
    eps_y:  0.0
    eps_z:  0.0

# material: 섹션 없음 → K-파일 *MAT 자동 사용 (파트별 개별 적용)
