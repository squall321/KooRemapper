# Example 08: Local Normals (Per-Node Averaged)
# Purpose: Use per-node averaged normals for better quality on curved surfaces
# Features: Phase 2 enhancement - local normals improve element quality

base_model: ../arc30/arc30_flat.k
output: 08_local_normals_result

operations:
  - type: offset
    source_pid: 1

    # Element configuration
    element_type: solid
    thickness: 1.0
    num_layers: 1

    # Direction
    offset_direction: +normal          # Use with +normal or -normal

    # Advanced Feature - KEY FEATURE
    use_local_normals: true            # Per-node averaged normals
                                       # Default: false (global averaged normal)

    # Connection
    connection_mode: tied

    # New part IDs
    new_pid: 10
    part_title: "LocalNormals_Offset"

    # Material card
    material_card: |
      *MAT_ELASTIC
      $#     mid        ro         e        pr
           @MID@       2.0     12000       0.25

# Note: Local normals improvement:
#   Without local normals (global average):
#     - Aspect Ratio: 13.33
#     - Jacobian: 0.119
#   With local normals (per-node average):
#     - Aspect Ratio: 7.38 (-45%)
#     - Jacobian: 0.505 (+324%)
#
# Best for:
#   - Curved surfaces
#   - Complex geometries
#   - When element quality is critical
