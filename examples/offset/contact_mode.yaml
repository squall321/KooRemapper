# Offset 예제 6: Contact connection mode
# 용도: 비결합(unbonded) 레이어 모델링
base_model: ../arc30/arc30_flat.k
output: contact_mode_result

operations:
  - type: offset
    source_pid: 1
    thickness: 1.5
    num_layers: 1
    element_type: solid
    offset_direction: +z
    connection_mode: contact
    new_pid: 15
    part_title: "Contact Offset Layer"
    material_card: |
      *MAT_ELASTIC
      $#     mid        ro         e        pr
           @MID@       1.8      8000       0.28

# 출력 파일에 *CONTACT_* 정의가 주석으로 포함됩니다.
# 사용자가 필요에 따라 주석을 제거하고 파라미터를 수정하십시오.
