# Offset 예제 1: 기본 solid offset (tied mode)
# 용도: 단열재 레이어 추가
base_model: ../arc30/arc30_flat.k
output: solid_tied_result

operations:
  - type: offset
    source_pid: 1
    thickness: 1.0
    num_layers: 1
    element_type: solid
    offset_direction: +z
    connection_mode: tied
    new_pid: 10
    part_title: "Insulation Layer"
    material_card: |
      *MAT_ELASTIC
      $#     mid        ro         e        pr
           @MID@       1.2      1000       0.3
