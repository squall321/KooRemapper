# Example 03: Thick Shell (TSHELL) Offset
# Purpose: Create TSHELL elements for shell-like structures with through-thickness integration
# Features: TSHELL element type, shell thickness parameter, single layer

base_model: ../arc30/arc30_flat.k
output: 03_tshell_result

operations:
  - type: offset
    source_pid: 1

    # Element configuration
    element_type: tshell               # Create TSHELL elements (thick shell)
    thickness: 1.5                     # Extrusion distance: 1.5 mm
    shell_thickness: 1.5               # Shell thickness: 1.5 mm
    num_layers: 1

    # Direction
    offset_direction: +z

    # Connection
    connection_mode: tied

    # New part IDs
    new_pid: 10
    part_title: "TShell_Offset"

    # Material card
    material_card: |
      *MAT_ELASTIC
      $#     mid        ro         e        pr
           @MID@       2.0     12000       0.25

# Note: TSHELL is useful for:
#   - Shell structures that need through-thickness stress/strain
#   - Transition between solid and shell meshes
#   - Reduced computational cost vs. multiple solid layers
