# Example 06: CZM (Cohesive Zone Model) Connection
# Purpose: Create cohesive elements between original and offset surfaces
# Features: CZM connection mode, cohesive material, delamination simulation

base_model: ../arc30/arc30_flat.k
output: 06_czm_result

operations:
  - type: offset
    source_pid: 1

    # Element configuration
    element_type: solid
    thickness: 1.0
    num_layers: 1

    # Direction
    offset_direction: +z

    # Connection - KEY FEATURE
    connection_mode: czm               # Create cohesive zone elements

    # New part IDs
    new_pid: 10
    part_title: "CZM_Offset"

    # Offset layer material
    material_card: |
      *MAT_ELASTIC
      $#     mid        ro         e        pr
           @MID@       2.0     12000       0.25

    # CZM material (for cohesive elements)
    czm_material_card: |
      *MAT_COHESIVE_MIXED_MODE
      $#     mid        ro      roflg      intfail
        @CZM_MID@       2.0         0          1.0
      $#      en        et        gic       giic      xmu      t      s
           20000     10000        0.5        0.5      2.0    1.0    1.0

# Note: CZM is useful for:
#   - Delamination analysis (composite materials)
#   - Interface failure simulation
#   - Adhesive layer modeling
#
# Key CZM parameters:
#   EN/ET: Normal/tangential stiffness
#   GIC/GIIC: Mode I/II fracture energy
#   T/S: Peak normal/shear traction
