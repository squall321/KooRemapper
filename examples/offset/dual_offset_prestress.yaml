# Offset 예제 4: Dual offset prestress (pouch wrapping)
# 용도: Battery pouch 감싸기 시뮬레이션
base_model: ../arc30/arc30_flat.k
output: dual_offset_result

# Material 정의 (dual offset prestress 모드에 필요)
E: 10000.0
nu: 0.3

operations:
  - type: offset
    source_pid: 1
    thickness: 1.2              # outer - inner = 1.0 - (-0.2) = 1.2
    num_layers: 1
    element_type: solid
    offset_direction: +normal
    connection_mode: tied
    prestress_mode: dual_offset
    inner_offset: -0.2          # 압축 상태 (음수)
    outer_offset: 1.0           # 릴랙스 상태 (양수)
    new_pid: 13
    part_title: "Pouch Wrapping Layer"
    material_card: |
      *MAT_ELASTIC
      $#     mid        ro         e        pr
           @MID@       1.0     10000       0.3
