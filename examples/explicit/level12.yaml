# =============================================================
# KooRemapper stabilize explicit - Level 12: 최대 보수
# =============================================================
#
# 언제 사용: 충격파, 폭발, 고속 충격 (HVI) 해석. 또는 Lv11까지
#            적용 후에도 에너지 진동이 남아있는 극단적 케이스.
#
# Level 11 대비 추가:
#   TSSFAC                    : 0.55 → 0.50 (최소 안전값)
#   CONTROL_BULK_VISCOSITY Q1 : 1.5 → 2.0  (강한 충격파 감쇠)
#   CONTROL_BULK_VISCOSITY Q2 : 0.06 → 0.10 (선형 점성 증가)
#
# TSSFAC=0.50 이유:
#   충격파 전파 시 파면(wave front)에서 dt가 급격히 변동.
#   0.50은 이론적 Courant 한계의 절반 → 최대 안전 마진.
#   이 이하로 줄이면 연산 시간 대비 효과가 미미.
#
# Q1=2.0, Q2=0.10 이유 (충격파/폭발 해석):
#   Q1 (2차 체적 점성): 충격파 전면의 압력 스파이크를 공간적으로
#                       분산. 수치 진동(Gibbs 현상) 억제.
#                       1.5(범용) vs 2.0(강충격): 폭발/HVI에선 2.0 권장.
#   Q2 (1차 체적 점성): 팽창파에서의 저속 진동 감쇠.
#                       0.06(범용) vs 0.10(충격파): 충격파 해석 표준.
#
#   ※ 고무/준정적 해석에는 Q1=1.5, Q2=0.06이 맞음 (Lv7에서 설정됨).
#      Q1/Q2를 높이면 인공 에너지 소산이 발생 → 과도하게 쓰지 말 것.
#
# 이 레벨에서도 불안정하면:
#   → 재료 모델 파라미터 재검토 (EOS, 실패 기준 등)
#   → ELFORM 변경 (SPH, meshfree 방법 고려)
#   → 모델 기하학적 문제 해결
#
# Usage: KooRemapper stabilize level12.yaml --confirm-erosion
# =============================================================

model:  your_model.k
output: your_model_lv12.k
stabilize: explicit
level: 12
confirm_erosion: true
