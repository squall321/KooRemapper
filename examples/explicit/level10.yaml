# =============================================================
# KooRemapper stabilize explicit - Level 10: 시간 스텝 3단계
# =============================================================
#
# 언제 사용: Lv 9까지 적용해도 dt가 주기적으로 크게 떨어지거나
#            에너지 피크가 남아있는 경우. 심각한 요소 변형 진행 중.
#
# Level 9 대비 추가:
#   TSSFAC           : 0.67 → 0.60
#   CONTROL_CONTACT NSBCS=2 : 버킷 검색 더욱 단축
#
# TSSFAC=0.60 적용 시점:
#   접촉과 호글래스 문제가 해결된 후에도 dt 변동이 심한 경우.
#   원인이 요소 변형(element distortion)에 의한 dt 급감이면
#   TSSFAC를 줄이는 것보다 ERODE(Lv11)가 더 직접적인 해법.
#
# NSBCS=2 이유:
#   Lv8의 NSBCS=5에서 더 단축. 빠른 변형/고속충격에서
#   2 cycle마다 버킷 재구성 → 접촉 누락 최소화.
#   비용: NSBCS=1 대비 절반의 검색 비용.
#
# 이 레벨에서도 불안정하면:
#   → 요소가 심하게 뒤틀려 dt→0에 수렴하는 경우 = Lv11 (ERODE) 필요
#   → 단순히 에너지가 크면 = Q1/Q2 조정 (Lv12)
#
# Usage: KooRemapper stabilize level10.yaml
# =============================================================

model:  your_model.k
output: your_model_lv10.k
stabilize: explicit
level: 10
