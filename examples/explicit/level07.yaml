# =============================================================
# KooRemapper stabilize explicit - Level 7: 시간 스텝 2단계 + 체적 점성
# =============================================================
#
# 언제 사용: Lv 3~6 적용 후에도 에너지 발산이 남아 있을 때.
#            고무, 폼, 충격 흡수 부품의 대변형 해석 표준 설정.
#
# Level 6 대비 추가:
#   TSSFAC              : 0.80 → 0.67 (고무 해석 권장값)
#   CONTROL_BULK_VISCOSITY : Q1=1.5, Q2=0.06 강제 설정
#
# TSSFAC=0.67 이유:
#   고무 등 고속파 재료는 기본 0.90이 너무 공격적.
#   0.67은 LS-DYNA 공식 고무 권장값.
#   단순 금속 충격 모델에선 0.80도 충분할 수 있음.
#
# BULK_VISCOSITY Q1/Q2 강제 설정 (override):
#   Q1 (2차 체적 점성): 충격파 앞에서 급격한 압력 변화 완화.
#     권장: 1.5 (범용). 충격파/폭발: 2.0 (Lv12에서 설정).
#   Q2 (1차 체적 점성): 선형 항. 저속 진동 감쇠.
#     권장: 0.06 (범용). 충격파: 0.10 (Lv12에서 설정).
#
#   ※ Q1/Q2는 이미 설정되어 있어도 이 레벨에서 override 됨.
#      변경 시 콘솔에 notice 출력.
#
# Usage: KooRemapper stabilize level07.yaml
# =============================================================

model:  your_model.k
output: your_model_lv07.k
stabilize: explicit
level: 7
