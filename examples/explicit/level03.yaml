# =============================================================
# KooRemapper stabilize explicit - Level 3: 시간 스텝 1단계
# =============================================================
#
# 언제 사용: dt 진동, 에너지 급증, 비교적 단순한 발산 현상.
#            대부분의 explicit 불안정 사례에서 첫 번째 실질 해결책.
#
# Level 2 대비 추가:
#   TSSFAC : 0.90 → 0.80  (Courant 안전계수 11% 감소)
#   INN    : 2 → 4         (솔리드 요소까지 불변량 노드 번호 확장)
#   DT2MS≠0 → WARNING      (mass scaling은 동적 정확도 훼손 → 강제 수정 안 함)
#
# TSSFAC 선택 기준:
#   0.90  : LS-DYNA 기본값 (대부분 문제 없음)
#   0.80  : Lv 3 (첫 번째 보수화)
#   0.67  : Lv 7 (고무/폼 표준, 유의미한 개선)
#   0.60  : Lv10 (심각한 불안정)
#   0.55  : Lv11 (침식 모드)
#   0.50  : Lv12 (최대 보수)
#
# INN=4 이유:
#   솔리드+쉘 모두 불변량 노드 번호 적용.
#   대변형 솔리드(고무, 폼)에서 결과 일관성 보장.
#
# Usage: KooRemapper stabilize level03.yaml
# =============================================================

model:  your_model.k
output: your_model_lv03.k
stabilize: explicit
level: 3
