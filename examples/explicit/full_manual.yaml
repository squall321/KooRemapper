# =============================================================
# KooRemapper stabilize explicit - Full Manual Mode
# =============================================================
#
# 모든 옵션을 직접 지정하는 모드.
# 'level' 키를 생략하거나 level: 0으로 설정하면 레벨 기본값을
# 적용하지 않고 여기서 명시한 값만 사용.
# 'level'을 함께 지정하면 레벨 기본값에서 명시 항목만 override.
#
# Usage:
#   레벨 없이 수동 완전 제어: level 키 생략
#   레벨 기반 + 일부 override: level: 5 + 필요한 항목만 명시
#
# Usage: KooRemapper stabilize full_manual.yaml
# =============================================================

model:  your_model.k
output: your_model_stable.k
stabilize: explicit
# level: 7                 # 생략 시 pure manual 모드

# ── 침식 확인 (level 11+ 또는 erode 명시 시) ──────────────────
# confirm_erosion: false   # true: interactive 확인 생략
#                          # false(기본): y/N 프롬프트 표시

# =============================================================
# [시간 스텝] *CONTROL_TIMESTEP
# =============================================================

# tssfac: 0.67
#   Courant 안전계수. dt_actual = tssfac * dt_critical
#   낮을수록 안정적이나 연산시간 증가.
#   기본값: 0.90
#   Lv 3: 0.80 / Lv 7: 0.67 / Lv10: 0.60 / Lv11: 0.55 / Lv12: 0.50
#   고무/폼 권장: 0.67  충격파: 0.50

# erode: 0
#   요소 침식 플래그 (multi-digit: solid/shell/beam)
#   0  : 비활성 (기본). dt 한계 도달 시 종료.
#   1  : 솔리드 요소 침식
#   10 : 쉘 요소 침식
#   11 : 솔리드+쉘 침식 (조립체 표준)
#   111: 솔리드+쉘+빔 모두 침식
#   !! 물리 변경: 요소 제거 → 질량/체적 비보존 !!
#   confirm_erosion: true 병행 권장

# =============================================================
# [호글래스] *CONTROL_HOURGLASS (글로벌 기본값)
# =============================================================
#
# 주의: 파트별 *HOURGLASS 카드가 있으면 그쪽이 우선됨.

# ihq: 4
#   호글래스 제어 타입
#   1 : 표준 점성 (기본). 속도 비례. 충격 해석.
#   2 : Flanagan-Belytschko 점성.
#   3 : FB 점성 + 정적 체적 보정. 비압축 개선.
#   4 : FB 강성 (★Lv 4). 변위 비례. 준정적/벤딩.
#   5 : FB 강성 (고무/폼 전용). IHQ=4와 유사.
#   6 : BB 물리 안정화 (★Lv 9). 가장 정확. 비용 大.
#       assumed strain field 사용. 비압축 대변형에 최적.

# qh: 0.10
#   호글래스 계수
#   IHQ 1~5: 0.05~0.15 권장. 높을수록 억제↑ but 인공강성↑
#             0.15 초과 시 불안정 가능.
#   IHQ 6~ : 1.0까지 안정. IHQ=6에서는 QH=1.0이 완전 안정화 표준.

# =============================================================
# [정확도] *CONTROL_ACCURACY
# =============================================================

# osu: 1
#   글로벌 객관 응력 업데이트
#   0 : off (기본). Hughes-Winget 알고리즘.
#   1 : on. 2차 Jaumann 회전 보정.
#       대변형/대회전 모델에서 강체 회전에 의한 허위 응력 방지.
#       소폭 비용 증가.

# inn: 4
#   불변량 노드 번호 (Invariant Node Numbering)
#   1 : off (explicit 기본)
#   2 : 쉘/후크쉘 적용 (implicit 기본)
#   4 : 솔리드+쉘 모두 적용 (★Lv 3~)
#       요소 내부 노드 처리 순서를 표준화 → 대변형 수치 일관성 보장.
#       고무/폼 솔리드 필수.

# =============================================================
# [요소 자동 정렬]
# =============================================================

# esort_solid: 1
#   *CONTROL_SOLID ESORT
#   0 : off (기본)
#   1 : 퇴화 TET/PENTA 요소 자동으로 더 나은 공식으로 전환
#       (예: 퇴화 HEX → TET4). d3hsp 경고 감소.

# esort_shell: 1
#   *CONTROL_SHELL ESORT
#   0 : off (기본)
#   1 : 퇴화 QUAD (공유된 두 절점) → TRI 공식으로 자동 전환

# =============================================================
# [쉘 안정화] *CONTROL_SHELL  (자동 감지: ELEMENT_SHELL 없으면 skip)
# =============================================================

# bwc: 1
#   Belytschko-Tsay 쉘 워핑 강성
#   2 : BT 표준. 워핑 무시 (기본).
#   1 : 워핑 강성 추가. 뒤틀린 쉘 국부 불안정 억제.
#       평면 쉘에는 차이 없음. 뒤틀린 기하학에서 유효.

# miter: 2
#   쉘 소성 반복 알고리즘 (MAT_003/018/019/024 등)
#   1 : 3 secant 반복 (기본). 빠름. 대변형 소성 부정확.
#   2 : Full iterative. 정확. 대변형 소성 해석 표준.
#   3 : Radial return (반복 없음). 가장 빠르나 덜 정확.

# irnxx: -2
#   쉘 노달 파이버 벡터 업데이트 방식
#   -1 : 매 cycle 재계산 (기본). 빠르나 대회전 시 불일치.
#   -2 : 증분 업데이트. 대변형/대회전 시 파이버 방향 일관성 보장.

# wrpang: 10
#   쉘 워핑 경고 각도 (도). 기본 20°.
#   낮출수록 더 엄격한 경고 발생 → 문제 있는 쉘 조기 탐지.

# =============================================================
# [접촉 전역] *CONTROL_CONTACT
# =============================================================

# orien: 2
#   접촉 세그먼트 법선 자동 재정렬
#   1 : part input 방식만 재정렬 (기본)
#   2 : 수동 정의 세그먼트 포함 전체 재정렬 (★Lv 6~)

# shlthk: 2
#   접촉 오프셋에 쉘 두께 포함 여부
#   0 : 미포함 (기본). 쉘이 중립면 기준 접촉.
#   1 : 쉘 두께 포함. 강체 제외.         (★Lv 6)
#   2 : 쉘 두께 포함. 강체 포함.         (★Lv 8~)
#       얇은 쉘에서 쉘 두께만큼 조기 접촉 감지 → 더 물리적.

# xpene: 2.0
#   최대 침투 허용 배수. 기본 4.0.
#   세그먼트 두께 × xpene 이상 침투한 노드 → 접촉에서 제외.
#   낮출수록 엄격: 4.0(기본) → 2.0(★Lv 6~)
#   너무 낮으면 정상 접촉 노드가 제외될 수 있음.

# enmass: 2
#   침식된 요소의 노드 접촉 처리
#   0 : 침식 노드 접촉에서 제거 (기본)
#   1 : 침식 솔리드 노드 접촉 유지         (★Lv 8)
#   2 : 침식 솔리드+쉘 노드 접촉 유지     (★Lv 11~)
#       ERODE 활성화 시 반드시 함께 설정.

# nsbcs: 5
#   버킷 검색 주기 (cycle 단위). 낮을수록 자주 검색.
#   기본: 자동 결정 (10~100).
#   Lv 8: 5  /  Lv10: 2  /  Lv11~: 1
#   낮출수록 접촉 감지 정확 but 연산비용 증가.
#   NSBCS=1: 매 cycle 검색 (침식 모드 표준).

# islchk: 2
#   초기 침투 검사 (진단용, d3hsp 리포트)
#   1 : 검사 없음 (기본)
#   2 : 전수 검사. 초기 침투 존재 위치를 d3hsp에 상세 보고.
#       모델 디버깅 시 항상 2로 설정 권장.

# =============================================================
# [접촉 per-contact] 모든 *CONTACT_* 카드에 일괄 적용
# =============================================================

# soft: 2
#   접촉 penalty 공식
#   0 : 표준 (기본). bulk modulus 기반 penalty.
#       동종 재료 접촉에 적합.
#   1 : Soft constraint. 노드 질량 기반 penalty.
#       이종 재료 (강성비 큰 경우) 접촉에 유리.    (★Lv 6)
#   2 : Pinball segment-based. 가장 강건.           (★Lv 8~)
#       대변형, 대슬라이딩, 고무/폼 접촉 표준.

# sbopt: 3
#   세그먼트 기반 접촉 검색 옵션
#   0 : 표준 수직 방향만 (기본)
#   2 : 뒤틀린 세그먼트 법선 보정 포함              (★Lv 6)
#   3 : edge-to-edge 접촉 + 뒤틀림 보정             (★Lv 8~)

# depth: 5
#   접촉 검색 깊이 (요소 레이어 수)
#   기본: 2.  높을수록 두꺼운 부품을 통과하는 접촉도 감지.
#   Lv 6: 3  /  Lv 8~: 5
#   높을수록 비용 증가.

# ignore: 1
#   초기 침투 처리
#   0 : 무시 → 초기 침투가 반발력으로 발산 유발 (기본)
#   1 : 초기 침투를 offset으로 처리               (★Lv 8~)
#       조립체/끼워맞춤 모델에서 거의 필수.
#   2 : 초기 침투 초기화 (geometry 변경). 더 극단적.

# maxpar: 1.15
#   SOFT=2(pinball) 침투 허용 배수. 기본 1.025.
#   세그먼트 크기의 n배 이상 침투 → 접촉에서 제외.
#   대변형 시 1.025로는 접촉 손실 발생 → 1.15~1.25 권장.  (★Lv 8~)

# =============================================================
# [체적 점성] *CONTROL_BULK_VISCOSITY
# =============================================================

# bulk_q1: 1.5
#   2차 체적 점성 계수 (기본 1.5)
#   충격파 전면의 압력 스파이크를 공간적으로 분산 (Gibbs 현상 억제).
#   범용: 1.5  /  충격파/폭발: 2.0 (★Lv12)
#   고무/준정적: 1.5 유지 (과도한 인공 소산 방지)

# bulk_q2: 0.06
#   1차 체적 점성 계수 (기본 0.06)
#   팽창파에서의 저속 진동 선형 감쇠.
#   범용: 0.06  /  충격파: 0.10 (★Lv12)
#
#   ※ Lv7에서 Q1=1.5, Q2=0.06 강제 설정됨.
#      Lv12에서 Q1=2.0, Q2=0.10으로 upgrade됨.

# =============================================================
# [에너지 추적] *CONTROL_ENERGY  (진단용, 안정성에 영향 없음)
# =============================================================

# hgen: 2
#   호글래스 에너지 계산
#   0 : off (기본)
#   2 : on. glstat에서 hourglass energy 항목 활성화.
#       hourglass energy / total energy > 10% → IHQ 업그레이드 필요.

# rwen: 2
#   리블릿(riblet) 에너지 계산
#   0 : off (기본) / 2 : on

# slnten: 2
#   슬라이딩 계면 에너지 계산
#   0 : off (기본) / 2 : on
#   접촉 에너지 과다 → 접촉 설정 재검토 신호.

# rylen: 2
#   레일리 감쇠 에너지 계산
#   0 : off (기본) / 2 : on

# =============================================================
# 실제 사용 예시 (주석 해제하여 사용)
# =============================================================

tssfac: 0.67
ihq: 6
qh: 1.0
osu: 1
inn: 4
esort_solid: 1
esort_shell: 1
bwc: 1
miter: 2
irnxx: -2
wrpang: 10
orien: 2
shlthk: 2
xpene: 2.0
enmass: 2
nsbcs: 2
islchk: 2
soft: 2
sbopt: 3
depth: 5
ignore: 1
maxpar: 1.15
bulk_q1: 1.5
bulk_q2: 0.06
hgen: 2
rwen: 2
slnten: 2
rylen: 2
