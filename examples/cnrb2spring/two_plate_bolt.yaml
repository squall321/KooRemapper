# CNRB 체결점을 두 강체 + 3축 이산 스프링 유격 조인트로 쪼갠다
model:  two_plate_bolt.k          # 이 YAML 폴더 기준. 절대 경로는 그대로
output: two_plate_bolt_spring.k

axis: z                           # 나사 축. 필수 — x|y|z (auto 없음)

# 물성 (labeled assumption — 실측 아님)
gap:         0.1                  # 반경 유격 ±[mm], 축이 아닌 두 방향에 적용
k_engage:    1.0e5                # 유격 소진 후 전단 강성 [N/mm]
k_axial:     1.0e7                # 축방향(나사 헤드 클램핑) 강성 [N/mm]
eps:         0.001                # 팬텀 노드 오프셋 [mm]
curve_range: 1.0                  # 곡선 가로축 반범위 [mm]

# 대상 (생략하면 덱의 모든 CNRB)
target_pids: [1201]

# ID 시작 번호 (네임스페이스별로 따로 충돌을 검사한다)
node_id_start: 90000001
elem_id_start: 9900001
card_id_start: 990001

pid_refs: strict                  # strict|warn
