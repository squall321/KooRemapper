<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material DB Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #0a0c10;
  --bg2: #0f1117;
  --surface: #161922;
  --surface2: #1c2030;
  --surface3: #232838;
  --border: #272d40;
  --border2: #333a52;
  --text: #e8ebf4;
  --text2: #8891aa;
  --text3: #5c6380;
  --accent: #6c8cff;
  --accent2: #4a6cf7;
  --accent-glow: rgba(108, 140, 255, 0.12);
  --green: #34d399;
  --green2: #059669;
  --orange: #fb923c;
  --red: #f87171;
  --cyan: #22d3ee;
  --purple: #a78bfa;
  --pink: #f472b6;
  --yellow: #fbbf24;
  --radius: 10px;
  --radius-sm: 6px;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --panel-list-w: 320px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

/* ══════ Scrollbar ══════ */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border2); }

/* ══════ App Layout ══════ */
.app {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100vh;
}

/* ══════ Top Bar ══════ */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  height: 48px;
  gap: 16px;
  z-index: 100;
}
.topbar .logo {
  font-size: 15px; font-weight: 700; letter-spacing: -0.5px;
  white-space: nowrap; display: flex; align-items: center; gap: 8px;
}
.topbar .logo svg { width: 20px; height: 20px; }
.topbar .logo span { color: var(--accent); }
.topbar .search-wrap { flex: 1; max-width: 480px; position: relative; }
.topbar .search-wrap input {
  width: 100%; padding: 7px 12px 7px 32px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text); font-size: 13px;
  outline: none; transition: border-color var(--transition);
}
.topbar .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.topbar .search-wrap input::placeholder { color: var(--text3); }
.topbar .search-wrap .search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text3); font-size: 13px; pointer-events: none;
}
.topbar .search-wrap .shortcut {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 6px; font-size: 10px; color: var(--text3);
  pointer-events: none;
}
.topbar .meta-info {
  font-size: 11px; color: var(--text3); white-space: nowrap;
  display: flex; align-items: center; gap: 12px;
}
.topbar .meta-info .count {
  background: var(--accent2); color: #fff; padding: 2px 8px;
  border-radius: 100px; font-weight: 600; font-size: 11px;
}
.topbar .actions { display: flex; gap: 6px; margin-left: auto; }
.topbar .action-btn {
  padding: 6px 12px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text2); font-size: 12px; cursor: pointer;
  transition: all var(--transition); font-family: inherit;
}
.topbar .action-btn:hover { border-color: var(--accent); color: var(--text); }
.topbar .action-btn.primary { background: var(--accent2); border-color: var(--accent); color: #fff; }
.topbar .action-btn.compare-active { background: var(--orange); border-color: var(--orange); color: #fff; }

/* ══════ Main Content ══════ */
.main {
  display: grid;
  grid-template-columns: var(--panel-list-w) 1fr;
  overflow: hidden;
}

/* ══════ Sidebar ══════ */
.sidebar {
  display: grid; grid-template-rows: auto 1fr;
  border-right: 1px solid var(--border); background: var(--bg2); overflow: hidden;
}
.cat-strip {
  padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 4px;
  border-bottom: 1px solid var(--border); background: var(--surface);
}
.cat-chip {
  padding: 3px 10px; border-radius: 100px; font-size: 11px; cursor: pointer;
  border: 1px solid var(--border); background: transparent; color: var(--text2);
  transition: all var(--transition); font-family: inherit;
  display: flex; align-items: center; gap: 4px;
}
.cat-chip:hover { border-color: var(--text3); color: var(--text); }
.cat-chip.active { border-color: var(--cat-color, var(--accent)); color: #fff; background: var(--cat-color, var(--accent)); }
.cat-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cat-color, var(--text3)); }
.cat-chip.active .dot { background: #fff; }

.mat-list { overflow-y: auto; overflow-x: hidden; }
.mat-item {
  padding: 10px 14px; cursor: pointer; transition: background var(--transition);
  display: grid; grid-template-columns: 8px 1fr auto; align-items: center;
  gap: 10px; border-bottom: 1px solid var(--border); position: relative;
}
.mat-item:hover { background: var(--surface); }
.mat-item.selected { background: var(--accent-glow); }
.mat-item.selected::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--accent);
}
.mat-item.compare-b { background: rgba(251, 146, 60, 0.08); }
.mat-item.compare-b::after {
  content: 'B'; position: absolute; right: 6px; top: 4px;
  background: var(--orange); color: #fff; font-size: 9px; font-weight: 700;
  width: 16px; height: 16px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.mat-item .dot { width: 8px; height: 8px; border-radius: 50%; }
.mat-item .info { min-width: 0; }
.mat-item .name {
  font-size: 12px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mat-item .sub {
  font-size: 10px; color: var(--text3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
}
.mat-item .mid-tag {
  font-size: 10px; color: var(--text3);
  font-family: 'JetBrains Mono', monospace; white-space: nowrap;
}

/* ══════ Detail Panel ══════ */
.detail { overflow-y: auto; overflow-x: hidden; background: var(--bg); }
.detail-inner { max-width: 1400px; margin: 0 auto; padding: 28px 36px 60px; }

.detail-hero {
  display: flex; align-items: flex-start; gap: 20px;
  margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border);
}
.detail-hero .cat-icon {
  width: 52px; height: 52px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; color: #fff; flex-shrink: 0; letter-spacing: -1px;
}
.detail-hero .hero-info { flex: 1; min-width: 0; }
.detail-hero h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.2; margin-bottom: 4px; }
.detail-hero .tag-line { font-size: 13px; color: var(--text2); margin-bottom: 8px; }
.detail-hero .badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 11px; padding: 3px 10px; border-radius: 100px; font-weight: 500; }
.badge-cat { border: 1px solid var(--border); color: var(--text2); }
.badge-type { background: var(--accent2); color: #fff; }
.badge-mid { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); font-family: 'JetBrains Mono', monospace; }

.section-divider { height: 1px; background: var(--border); margin: 36px 0 28px; }

/* ── Properties ── */
.prop-section { margin-bottom: 32px; }
.prop-section-title {
  font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text3); margin-bottom: 14px;
}
.prop-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;
}
.prop-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; transition: border-color var(--transition);
}
.prop-card:hover { border-color: var(--border2); }
.prop-card .label { font-size: 11px; color: var(--text3); margin-bottom: 8px; display: flex; justify-content: space-between; }
.prop-card .value {
  font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', monospace;
  letter-spacing: -0.5px; line-height: 1; margin-bottom: 6px;
}
.prop-card .unit { font-size: 11px; color: var(--text3); }
.prop-card .gauge { height: 4px; background: var(--surface3); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.prop-card .gauge-fill { height: 100%; border-radius: 2px; transition: width 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); }

/* ── Charts ── */
.charts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 28px; }
.charts-grid.single { grid-template-columns: 1fr; }
.chart-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; position: relative;
}
.chart-card h4 {
  font-size: 12px; color: var(--text2); margin-bottom: 16px;
  font-weight: 500; display: flex; align-items: center; gap: 6px;
}
.chart-card h4 .chart-icon { color: var(--accent); font-size: 14px; }
.chart-container { position: relative; width: 100%; }

/* ── Card Preview ── */
.card-block {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 12px; overflow: hidden;
}
.card-block summary {
  padding: 12px 16px; font-size: 12px; font-weight: 500; cursor: pointer;
  color: var(--text2); list-style: none;
  display: flex; align-items: center; gap: 8px; transition: background var(--transition);
}
.card-block summary:hover { background: var(--surface2); }
.card-block summary::before { content: '\25B6'; font-size: 8px; transition: transform var(--transition); color: var(--text3); }
.card-block[open] summary::before { transform: rotate(90deg); }
.card-block summary .card-actions { margin-left: auto; display: flex; gap: 4px; }
.card-block .pre-wrap {
  border-top: 1px solid var(--border); background: var(--bg); position: relative;
}
.card-block pre {
  padding: 16px 20px; font-size: 12px; line-height: 1.7;
  font-family: 'JetBrains Mono', monospace; color: var(--cyan); overflow-x: auto;
  margin: 0;
}
.card-block pre .kw { color: var(--accent); font-weight: 500; }
.card-block pre .cm { color: var(--text3); }

/* Card action buttons */
.card-btn {
  padding: 3px 8px; font-size: 10px; border-radius: 4px;
  border: 1px solid var(--border); background: var(--surface2);
  color: var(--text3); cursor: pointer; font-family: inherit;
  transition: all var(--transition); white-space: nowrap;
}
.card-btn:hover { border-color: var(--accent); color: var(--text); }
.card-btn.copied { background: var(--green2); border-color: var(--green); color: #fff; }

/* ── Placeholder ── */
.placeholder {
  display: flex; align-items: center; justify-content: center;
  height: 100%; color: var(--text3); font-size: 13px; flex-direction: column; gap: 10px;
}
.placeholder svg { width: 48px; height: 48px; opacity: 0.2; }

/* ── Radar ── */
.radar-wrap { display: flex; justify-content: center; margin-bottom: 28px; }
.radar-wrap canvas { max-width: 400px; max-height: 400px; }

/* ── Compare Mode ── */
.compare-banner {
  display: none; background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 8px 24px; align-items: center; gap: 12px; font-size: 12px; color: var(--text2);
}
.compare-banner.visible { display: flex; }
.compare-banner .compare-label { color: var(--orange); font-weight: 600; }
.compare-banner .compare-names { flex: 1; }
.compare-banner .compare-names span { font-weight: 500; color: var(--text); }
.compare-close {
  padding: 4px 10px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text2); cursor: pointer;
  font-size: 11px; font-family: inherit; transition: all var(--transition);
}
.compare-close:hover { border-color: var(--red); color: var(--red); }

/* Compare side-by-side */
.compare-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.compare-col { min-width: 0; }
.compare-col-header {
  font-size: 14px; font-weight: 600; margin-bottom: 16px;
  padding-bottom: 8px; border-bottom: 2px solid var(--accent);
  display: flex; align-items: center; gap: 8px;
}
.compare-col-header.col-b { border-bottom-color: var(--orange); }
.compare-col-header .col-tag {
  font-size: 10px; padding: 2px 8px; border-radius: 100px; font-weight: 700; color: #fff;
}
.compare-table { width: 100%; margin-bottom: 24px; }
.compare-table th {
  font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px;
  padding: 8px 0; text-align: left; border-bottom: 1px solid var(--border); font-weight: 600;
}
.compare-table td {
  padding: 8px 0; font-size: 13px; border-bottom: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
}
.compare-table td.prop-name { font-family: 'Inter', sans-serif; color: var(--text2); font-size: 12px; }
.compare-table td.val-a { color: var(--accent); }
.compare-table td.val-b { color: var(--orange); }
.compare-table td.diff { font-size: 11px; }
.compare-table td.diff.higher { color: var(--green); }
.compare-table td.diff.lower { color: var(--red); }
.compare-table td.diff.same { color: var(--text3); }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: var(--radius); padding: 10px 20px;
  font-size: 13px; color: var(--text); z-index: 1000;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
  opacity: 0; pointer-events: none;
}
.toast.visible { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ── File drop overlay ── */
.drop-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(10, 12, 16, 0.92); z-index: 1000;
  align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  font-size: 16px; color: var(--accent); border: 2px dashed var(--accent);
  margin: 20px; border-radius: 20px;
}
.drop-overlay.visible { display: flex; }

/* ── Category colors ── */
.c-metal { --cat-color: #60a5fa; }
.c-polymer { --cat-color: #4ade80; }
.c-rubber { --cat-color: #fb923c; }
.c-glass { --cat-color: #22d3ee; }
.c-ceramic { --cat-color: #f472b6; }
.c-composite { --cat-color: #a78bfa; }
.c-tape { --cat-color: #fbbf24; }
.c-pcb { --cat-color: #34d399; }
.c-display { --cat-color: #c084fc; }
.c-semiconductor { --cat-color: #f87171; }
.c-magnet { --cat-color: #e879f9; }
.c-other { --cat-color: #8891aa; }

@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; }
  .sidebar { max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
  .detail-inner { padding: 20px 16px 40px; }
  .charts-grid { grid-template-columns: 1fr; }
  .compare-layout { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1" stroke="var(--accent)"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="var(--green)"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="var(--orange)"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="var(--purple)"/></svg>
      Material <span>DB</span>
    </div>
    <div class="search-wrap">
      <span class="search-icon">&#9906;</span>
      <input type="text" id="search" placeholder="Search by name, tag, MID, type..." disabled>
      <span class="shortcut">/</span>
    </div>
    <div class="meta-info">
      <span id="dbMeta">Load material_db.json</span>
      <span class="count" id="countBadge">0</span>
    </div>
    <div class="actions">
      <input type="file" id="fileInput" accept=".json" style="display:none">
      <button class="action-btn" onclick="document.getElementById('fileInput').click()">Load JSON</button>
      <button class="action-btn" id="compareBtn" onclick="toggleCompareMode()" title="Right-click a material to set as Compare B">Compare</button>
    </div>
  </div>

  <div class="compare-banner" id="compareBanner">
    <span class="compare-label">COMPARE</span>
    <div class="compare-names">
      <span id="compareNameA">-</span> vs <span id="compareNameB" style="color:var(--orange)">-</span>
    </div>
    <button class="compare-close" onclick="exitCompare()">Exit Compare</button>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="cat-strip" id="catStrip"></div>
      <div class="mat-list" id="matList">
        <div class="placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <div>Load material_db.json</div>
        </div>
      </div>
    </div>
    <div class="detail" id="detailPanel">
      <div class="placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg>
        <div>Select a material to view properties</div>
        <div style="font-size:11px;color:var(--text3)">Right-click to set Compare B, then click Compare</div>
      </div>
    </div>
  </div>
</div>

<div class="drop-overlay" id="dropOverlay">Drop material_db.json here</div>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════
let DB = null;
let allMaterials = [];
let filtered = [];
let selectedMid = null;
let compareMidB = null; // second material for comparison
let compareMode = false;
let activeCategories = new Set();
let chartInstances = [];

const CAT_COLORS = {
  metal:'#60a5fa', polymer:'#4ade80', rubber:'#fb923c', glass:'#22d3ee',
  ceramic:'#f472b6', composite:'#a78bfa', tape:'#fbbf24', pcb:'#34d399',
  display:'#c084fc', semiconductor:'#f87171', magnet:'#e879f9', other:'#8891aa'
};
const CAT_LABELS = {
  metal:'Metal', polymer:'Polymer', rubber:'Rubber', glass:'Glass',
  ceramic:'Ceramic', composite:'Composite', tape:'Tape', pcb:'PCB',
  display:'Display', semiconductor:'Semi', magnet:'Magnet', other:'Other'
};
const CAT_ABBR = {
  metal:'Fe', polymer:'Pl', rubber:'Rb', glass:'Gl',
  ceramic:'Ce', composite:'Co', tape:'Tp', pcb:'Bd',
  display:'Dp', semiconductor:'Si', magnet:'Mg', other:'?'
};

// ── Helpers ──
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(v) {
  if (v == null || v === '') return '\u2014';
  if (typeof v === 'number') {
    if (v === 0) return '0';
    const abs = Math.abs(v);
    if (abs >= 1e6 || abs < 0.001) return v.toExponential(3);
    if (abs >= 100) return v.toFixed(1);
    if (abs >= 1) return v.toFixed(3);
    return v.toPrecision(4);
  }
  return String(v);
}
function syntaxHL(s) {
  return esc(s)
    .replace(/^(\*[A-Z_]+.*)$/gm, '<span class="kw">$1</span>')
    .replace(/^(\$.*$)/gm, '<span class="cm">$1</span>');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 2000);
}

// ── File loading ──
document.getElementById('fileInput').addEventListener('change', e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});
document.body.addEventListener('dragover', e => {
  e.preventDefault();
  document.getElementById('dropOverlay').classList.add('visible');
});
document.body.addEventListener('dragleave', e => {
  if (!e.relatedTarget || e.relatedTarget === document.documentElement)
    document.getElementById('dropOverlay').classList.remove('visible');
});
document.body.addEventListener('drop', e => {
  e.preventDefault();
  document.getElementById('dropOverlay').classList.remove('visible');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
function loadFile(file) {
  const r = new FileReader();
  r.onload = e => {
    try { DB = JSON.parse(e.target.result); initDB(); }
    catch (err) { alert('Invalid JSON: ' + err.message); }
  };
  r.readAsText(file);
}
window.addEventListener('DOMContentLoaded', () => {
  const paths = ['../../materials/material_db.json', 'material_db.json', '../material_db.json'];
  (function tryLoad(i) {
    if (i >= paths.length) return;
    fetch(paths[i]).then(r => r.ok ? r.json() : Promise.reject())
      .then(data => { DB = data; initDB(); })
      .catch(() => tryLoad(i + 1));
  })(0);
});

// ── Init ──
function initDB() {
  const meta = DB._meta || {};
  document.getElementById('dbMeta').textContent =
    `${meta.unit_system || 'ton/mm/s/MPa'} \u2022 ${meta.created || ''}`;
  document.getElementById('search').disabled = false;
  allMaterials = Object.entries(DB.materials).map(([mid, m]) => ({ mid: parseInt(mid), ...m }));
  allMaterials.sort((a, b) => a.mid - b.mid);

  const cats = [...new Set(allMaterials.map(m => m.category || 'other'))].sort();
  document.getElementById('catStrip').innerHTML = cats.map(c => {
    const cnt = allMaterials.filter(m => (m.category || 'other') === c).length;
    return `<button class="cat-chip c-${c}" data-cat="${c}" onclick="toggleCat('${c}',this)">` +
      `<span class="dot"></span>${CAT_LABELS[c]||c} <span style="opacity:0.6">${cnt}</span></button>`;
  }).join('');
  applyFilter();
  if (filtered.length > 0) selectMaterial(filtered[0].mid);
}

function toggleCat(cat, btn) {
  if (activeCategories.has(cat)) { activeCategories.delete(cat); btn.classList.remove('active'); }
  else { activeCategories.add(cat); btn.classList.add('active'); }
  applyFilter();
}
document.getElementById('search').addEventListener('input', () => applyFilter());

function applyFilter() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  filtered = allMaterials.filter(m => {
    if (activeCategories.size > 0 && !activeCategories.has(m.category || 'other')) return false;
    if (!q) return true;
    return m.name?.toLowerCase().includes(q) || (m.tag||'').toLowerCase().includes(q) ||
           String(m.mid).includes(q) || (m.mat_type||'').toLowerCase().includes(q) ||
           (m.description||'').toLowerCase().includes(q);
  });
  document.getElementById('countBadge').textContent = filtered.length;
  renderList();
}

function renderList() {
  const el = document.getElementById('matList');
  if (filtered.length === 0) {
    el.innerHTML = '<div class="placeholder"><div>No materials found</div></div>';
    return;
  }
  el.innerHTML = filtered.map(m => {
    const c = m.category || 'other';
    const E = m.mechanical?.E_GPa;
    const sel = m.mid === selectedMid ? ' selected' : '';
    const cmpB = m.mid === compareMidB ? ' compare-b' : '';
    return `<div class="mat-item${sel}${cmpB} c-${c}" data-mid="${m.mid}"
      onclick="selectMaterial(${m.mid})" oncontextmenu="onRightClick(event,${m.mid})">
      <div class="dot" style="background:${CAT_COLORS[c]||'#888'}"></div>
      <div class="info">
        <div class="name">${esc(m.name)}</div>
        <div class="sub">${m.mat_type?.replace('MAT_','')||''} ${E!=null?'\u2022 '+E+' GPa':''}</div>
      </div>
      <div class="mid-tag">${m.mid}</div>
    </div>`;
  }).join('');
}

function onRightClick(e, mid) {
  e.preventDefault();
  compareMidB = mid;
  renderList();
  const m = allMaterials.find(x => x.mid === mid);
  showToast(`Compare B: ${m?.name || mid} \u2014 Click "Compare" to compare`);
}

function selectMaterial(mid) {
  selectedMid = mid;
  document.querySelectorAll('.mat-item').forEach(el => {
    el.classList.toggle('selected', parseInt(el.dataset.mid) === mid);
  });
  const m = allMaterials.find(m => m.mid === mid);
  if (compareMode && compareMidB) {
    const mB = allMaterials.find(x => x.mid === compareMidB);
    if (m && mB) renderCompare(m, mB);
  } else if (m) {
    renderDetail(m);
  }
  const item = document.querySelector(`.mat-item[data-mid="${mid}"]`);
  if (item) item.scrollIntoView({ block: 'nearest' });
}

// ── Compare mode ──
function toggleCompareMode() {
  if (compareMode) { exitCompare(); return; }
  if (!compareMidB) { showToast('Right-click a material to set as Compare B first'); return; }
  compareMode = true;
  document.getElementById('compareBtn').classList.add('compare-active');
  document.getElementById('compareBtn').textContent = 'Comparing...';
  document.getElementById('compareBanner').classList.add('visible');
  if (selectedMid) selectMaterial(selectedMid);
}
function exitCompare() {
  compareMode = false;
  compareMidB = null;
  document.getElementById('compareBtn').classList.remove('compare-active');
  document.getElementById('compareBtn').textContent = 'Compare';
  document.getElementById('compareBanner').classList.remove('visible');
  renderList();
  if (selectedMid) {
    const m = allMaterials.find(x => x.mid === selectedMid);
    if (m) renderDetail(m);
  }
}

// ══════════════════════════════════════════════════════════════
//  Card helpers: Copy & Download
// ══════════════════════════════════════════════════════════════
function getRawCardText(m, cardKey) {
  if (cardKey === 'thermal') return (m.card_thermal || '') + (m.card_thermal_expansion ? '\n' + m.card_thermal_expansion : '');
  if (cardKey === 'damping') return m.card_damping || '';
  return (m.cards_structural || {})[cardKey] || '';
}

function copyCard(mid, cardKey) {
  const m = allMaterials.find(x => x.mid === mid);
  if (!m) return;
  const text = getRawCardText(m, cardKey);
  navigator.clipboard.writeText(text).then(() => {
    showToast('Copied to clipboard');
    const btn = document.querySelector(`[data-copy="${mid}-${cardKey}"]`);
    if (btn) { btn.classList.add('copied'); btn.textContent = 'Copied!'; setTimeout(() => { btn.classList.remove('copied'); btn.textContent = 'Copy'; }, 1500); }
  });
}

function downloadCard(mid, cardKey) {
  const m = allMaterials.find(x => x.mid === mid);
  if (!m) return;
  const text = '*KEYWORD\n' + getRawCardText(m, cardKey) + '\n*END\n';
  const safeName = m.name.replace(/[^a-zA-Z0-9_-]/g, '_');
  const fname = `${safeName}_MID${mid}_${cardKey}.k`;
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast(`Downloaded ${fname}`);
}

function downloadAllCards(mid) {
  const m = allMaterials.find(x => x.mid === mid);
  if (!m) return;
  let text = '*KEYWORD\n*TITLE\n' + m.name + ' (MID ' + mid + ')\n';
  const cards = m.cards_structural || {};
  for (const [ctype, ctext] of Object.entries(cards)) {
    if (ctext) text += ctext + '\n';
  }
  if (m.card_thermal) text += m.card_thermal + '\n';
  if (m.card_thermal_expansion) text += m.card_thermal_expansion + '\n';
  if (m.card_damping) text += m.card_damping + '\n';
  text += '*END\n';
  const safeName = m.name.replace(/[^a-zA-Z0-9_-]/g, '_');
  const fname = `${safeName}_MID${mid}_all.k`;
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast(`Downloaded ${fname}`);
}

// ══════════════════════════════════════════════════════════════
//  Render Detail (single material)
// ══════════════════════════════════════════════════════════════
const MECH_DEFS = [
  { key: 'rho_g_cm3', label: 'Density', unit: 'g/cm\u00b3', color: '#60a5fa' },
  { key: 'E_GPa', label: "Young's Modulus E", unit: 'GPa', color: '#5b8af5' },
  { key: 'PR', label: "Poisson's Ratio \u03BD", unit: '\u2014', color: '#a78bfa' },
  { key: 'SIGY', label: 'Yield Stress \u03C3y', unit: 'MPa', color: '#fb923c' },
  { key: 'ETAN', label: 'Tangent Modulus', unit: 'MPa', color: '#fbbf24' },
  { key: 'BULK', label: 'Bulk Modulus K', unit: 'MPa', color: '#34d399' },
  { key: 'G0', label: 'Shear G\u221E', unit: 'MPa', color: '#22d3ee' },
  { key: 'GI', label: 'Shear G\u2080', unit: 'MPa', color: '#38bdf8' },
  { key: 'BETA', label: 'Decay \u03B2', unit: '1/s', color: '#e879f9' },
  { key: 'A', label: 'Mooney A', unit: 'MPa', color: '#fb923c' },
  { key: 'B', label: 'Mooney B', unit: 'MPa', color: '#fbbf24' },
];
const THERM_DEFS = [
  { key: 'Cp_SI', label: 'Specific Heat Cp', unit: 'J/(kg\u00b7K)', color: '#f87171' },
  { key: 'k_SI', label: 'Conductivity k', unit: 'W/(m\u00b7K)', color: '#fb923c' },
  { key: 'ALPHA_ppm_K', label: 'CTE \u03B1', unit: 'ppm/K', color: '#fbbf24' },
];

function renderPropGrid(mech, therm, damp, cat) {
  let html = '';
  const peers = allMaterials.filter(p => p.category === cat);
  const hasMech = MECH_DEFS.some(p => mech[p.key] != null);
  if (hasMech) {
    html += `<div class="prop-section"><div class="prop-section-title">Mechanical Properties</div><div class="prop-grid">`;
    MECH_DEFS.forEach(p => {
      if (mech[p.key] == null) return;
      const val = mech[p.key];
      const vals = peers.map(pe => pe.mechanical?.[p.key]).filter(v => v != null && v > 0);
      const maxVal = vals.length ? Math.max(...vals) : Math.abs(val) * 2 || 1;
      const pct = Math.min(100, Math.max(2, (Math.abs(val) / maxVal) * 100));
      html += `<div class="prop-card"><div class="label"><span>${p.label}</span><span>${p.unit}</span></div>
        <div class="value" style="color:${p.color}">${fmt(val)}</div>
        <div class="gauge"><div class="gauge-fill" style="width:${pct}%;background:${p.color}"></div></div></div>`;
    });
    html += `</div></div>`;
  }
  const hasTherm = THERM_DEFS.some(p => therm[p.key] != null);
  if (hasTherm) {
    html += `<div class="prop-section"><div class="prop-section-title">Thermal Properties</div><div class="prop-grid">`;
    THERM_DEFS.forEach(p => {
      if (therm[p.key] == null) return;
      const val = therm[p.key];
      const vals = peers.map(pe => pe.thermal?.[p.key]).filter(v => v != null && v > 0);
      const maxVal = vals.length ? Math.max(...vals) : Math.abs(val) * 2 || 1;
      const pct = Math.min(100, Math.max(2, (Math.abs(val) / maxVal) * 100));
      html += `<div class="prop-card"><div class="label"><span>${p.label}</span><span>${p.unit}</span></div>
        <div class="value" style="color:${p.color}">${fmt(val)}</div>
        <div class="gauge"><div class="gauge-fill" style="width:${pct}%;background:${p.color}"></div></div></div>`;
    });
    html += `</div></div>`;
  }
  if (damp && (damp.zeta || damp.alpha || damp.beta)) {
    html += `<div class="prop-section"><div class="prop-section-title">Rayleigh Damping</div><div class="prop-grid">`;
    if (damp.zeta != null) html += `<div class="prop-card"><div class="label"><span>\u03B6 Damping Ratio</span><span>\u2014</span></div><div class="value" style="color:var(--green)">${fmt(damp.zeta)}</div><div class="unit">${(damp.zeta*100).toFixed(2)}%</div></div>`;
    if (damp.alpha != null) html += `<div class="prop-card"><div class="label"><span>\u03B1 Mass</span><span>1/s</span></div><div class="value" style="color:var(--cyan)">${fmt(damp.alpha)}</div></div>`;
    if (damp.beta != null) html += `<div class="prop-card"><div class="label"><span>\u03B2 Stiffness</span><span>s</span></div><div class="value" style="color:var(--purple)">${fmt(damp.beta)}</div></div>`;
    html += `</div></div>`;
  }
  return html;
}

function renderCardBlocks(m) {
  const cardTypes = m.cards_structural || {};
  const hasCards = Object.keys(cardTypes).length > 0 || m.card_thermal || m.card_thermal_expansion || m.card_damping;
  if (!hasCards) return '';

  let html = `<div class="prop-section">
    <div class="prop-section-title" style="display:flex;align-items:center;justify-content:space-between">
      LS-DYNA Card Preview
      <button class="card-btn" onclick="downloadAllCards(${m.mid})" style="text-transform:none;letter-spacing:0">
        \u2B73 Download All (.k)
      </button>
    </div></div>`;

  for (const [ctype, ctext] of Object.entries(cardTypes)) {
    if (!ctext) continue;
    html += `<details class="card-block" open><summary>
      ${esc(ctype)}
      <span class="card-actions">
        <button class="card-btn" data-copy="${m.mid}-${ctype}" onclick="event.stopPropagation();copyCard(${m.mid},'${ctype}')">Copy</button>
        <button class="card-btn" onclick="event.stopPropagation();downloadCard(${m.mid},'${ctype}')">\u2B73 .k</button>
      </span>
    </summary><div class="pre-wrap"><pre>${syntaxHL(ctext)}</pre></div></details>`;
  }
  if (m.card_thermal || m.card_thermal_expansion) {
    html += `<details class="card-block"><summary>
      MAT_THERMAL_ISOTROPIC + EXPANSION
      <span class="card-actions">
        <button class="card-btn" data-copy="${m.mid}-thermal" onclick="event.stopPropagation();copyCard(${m.mid},'thermal')">Copy</button>
        <button class="card-btn" onclick="event.stopPropagation();downloadCard(${m.mid},'thermal')">\u2B73 .k</button>
      </span>
    </summary><div class="pre-wrap"><pre>${syntaxHL((m.card_thermal||'')+'\n'+(m.card_thermal_expansion||''))}</pre></div></details>`;
  }
  if (m.card_damping) {
    html += `<details class="card-block"><summary>
      DAMPING (SET + MASS + STIFFNESS)
      <span class="card-actions">
        <button class="card-btn" data-copy="${m.mid}-damping" onclick="event.stopPropagation();copyCard(${m.mid},'damping')">Copy</button>
        <button class="card-btn" onclick="event.stopPropagation();downloadCard(${m.mid},'damping')">\u2B73 .k</button>
      </span>
    </summary><div class="pre-wrap"><pre>${syntaxHL(m.card_damping)}</pre></div></details>`;
  }
  return html;
}

function renderDetail(m) {
  const dp = document.getElementById('detailPanel');
  chartInstances.forEach(c => c.destroy());
  chartInstances = [];

  const mech = m.mechanical || {};
  const therm = m.thermal || {};
  const damp = m.damping || {};
  const cat = m.category || 'other';
  const color = CAT_COLORS[cat] || '#888';

  let html = `<div class="detail-inner">`;

  // Hero
  html += `<div class="detail-hero">
    <div class="cat-icon" style="background:${color}">${CAT_ABBR[cat]||'?'}</div>
    <div class="hero-info">
      <h2>${esc(m.name)}</h2>
      <div class="tag-line">${esc(m.tag||'')} ${m.description ? '\u2014 '+esc(m.description) : ''}</div>
      <div class="badges">
        <span class="badge badge-cat" style="border-color:${color};color:${color}">${CAT_LABELS[cat]||cat}</span>
        <span class="badge badge-type">${m.mat_type||''}</span>
        <span class="badge badge-mid">MID ${m.mid}</span>
        ${damp.zeta ? `<span class="badge badge-cat" style="border-color:var(--green);color:var(--green)">\u03B6=${damp.zeta}</span>` : ''}
      </div>
    </div>
  </div>`;

  // Properties
  html += renderPropGrid(mech, therm, damp, cat);
  html += `<div class="section-divider"></div>`;

  // Charts
  html += `<div class="prop-section"><div class="prop-section-title">Property Overview</div>
    <div class="radar-wrap"><canvas id="chartRadar" width="400" height="400"></canvas></div></div>`;
  html += `<div class="prop-section"><div class="prop-section-title">Category Comparison: ${CAT_LABELS[cat]||cat}</div>`;
  html += `<div class="charts-grid">
    <div class="chart-card"><h4><span class="chart-icon">\u25A0</span> Young's Modulus (GPa)</h4><div class="chart-container"><canvas id="chartE"></canvas></div></div>
    <div class="chart-card"><h4><span class="chart-icon">\u25CF</span> Density (g/cm\u00b3)</h4><div class="chart-container"><canvas id="chartRho"></canvas></div></div>
  </div>`;
  html += `<div class="charts-grid">
    <div class="chart-card"><h4><span class="chart-icon">\u2197</span> CTE (ppm/K)</h4><div class="chart-container"><canvas id="chartCTE"></canvas></div></div>
    <div class="chart-card"><h4><span class="chart-icon">\u2248</span> Thermal Conductivity (W/m\u00b7K)</h4><div class="chart-container"><canvas id="chartTC"></canvas></div></div>
  </div>`;
  // ── Material-specific charts ──
  const parsedCard = parseCardParams(m);

  // Viscoelastic: G(t) relaxation + DMA (G', G'', tan delta)
  if (mech.G0 && mech.GI != null && mech.BETA) {
    html += `<div class="charts-grid">
      <div class="chart-card"><h4><span class="chart-icon">\u223F</span> Shear Relaxation G(t)</h4><div class="chart-container"><canvas id="chartVE"></canvas></div></div>
      <div class="chart-card"><h4><span class="chart-icon">\u223F</span> DMA: Storage G' & Loss G'' vs Frequency</h4><div class="chart-container"><canvas id="chartDMA"></canvas></div></div>
    </div>`;
    html += `<div class="charts-grid single">
      <div class="chart-card"><h4><span class="chart-icon">\u03B4</span> Loss Factor tan(\u03B4) vs Frequency</h4><div class="chart-container"><canvas id="chartTanD"></canvas></div></div>
    </div>`;
  }

  // Elastoplastic: Stress-strain + loading/unloading + strain rate effect
  if (mech.SIGY || parsedCard.SIGY) {
    const sigy = mech.SIGY || parsedCard.SIGY;
    const E = mech.E || parsedCard.E;
    const etan = parsedCard.ETAN || 0;
    if (E && sigy) {
      html += `<div class="charts-grid">
        <div class="chart-card"><h4><span class="chart-icon">\u03C3</span> Stress-Strain Curve (Bilinear)</h4><div class="chart-container"><canvas id="chartSS"></canvas></div></div>
        <div class="chart-card"><h4><span class="chart-icon">\u21C4</span> Loading / Unloading Cycle</h4><div class="chart-container"><canvas id="chartLU"></canvas></div></div>
      </div>`;
      if (parsedCard.C && parsedCard.P) {
        html += `<div class="charts-grid single">
          <div class="chart-card"><h4><span class="chart-icon">\u26A1</span> Cowper-Symonds Strain Rate Effect</h4><div class="chart-container"><canvas id="chartSR"></canvas></div></div>
        </div>`;
      }
    }
  }

  // Mooney-Rivlin rubber: stress-stretch curve
  if (mech.A && mech.B) {
    html += `<div class="charts-grid single">
      <div class="chart-card"><h4><span class="chart-icon">\u223F</span> Mooney-Rivlin Uniaxial Tension (Stress vs Stretch)</h4><div class="chart-container"><canvas id="chartMR"></canvas></div></div>
    </div>`;
  }

  // Rayleigh damping
  if (damp.alpha && damp.beta) {
    html += `<div class="charts-grid single"><div class="chart-card"><h4><span class="chart-icon">\u03B6</span> Rayleigh Damping vs Frequency</h4><div class="chart-container"><canvas id="chartDamp"></canvas></div></div></div>`;
  }
  html += `</div>`; // end prop-section

  html += `<div class="section-divider"></div>`;

  // Cards
  html += renderCardBlocks(m);

  html += `</div>`;
  dp.innerHTML = html;
  requestAnimationFrame(() => buildAllCharts(m));
}

// ══════════════════════════════════════════════════════════════
//  Render Compare (two materials side-by-side)
// ══════════════════════════════════════════════════════════════
function renderCompare(mA, mB) {
  const dp = document.getElementById('detailPanel');
  chartInstances.forEach(c => c.destroy());
  chartInstances = [];

  document.getElementById('compareNameA').textContent = mA.name;
  document.getElementById('compareNameB').textContent = mB.name;

  const catA = mA.category || 'other';
  const catB = mB.category || 'other';

  let html = `<div class="detail-inner">`;

  // Compare header
  html += `<div style="display:flex;gap:16px;margin-bottom:28px">
    <div style="flex:1;display:flex;align-items:center;gap:12px">
      <div class="cat-icon" style="background:${CAT_COLORS[catA]||'#888'};width:40px;height:40px;border-radius:10px;font-size:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">${CAT_ABBR[catA]}</div>
      <div><div style="font-size:16px;font-weight:600">${esc(mA.name)}</div><div style="font-size:11px;color:var(--text3)">MID ${mA.mid} \u2022 ${mA.mat_type||''}</div></div>
    </div>
    <div style="display:flex;align-items:center;color:var(--text3);font-size:13px;font-weight:600">VS</div>
    <div style="flex:1;display:flex;align-items:center;gap:12px;justify-content:flex-end;text-align:right">
      <div><div style="font-size:16px;font-weight:600;color:var(--orange)">${esc(mB.name)}</div><div style="font-size:11px;color:var(--text3)">MID ${mB.mid} \u2022 ${mB.mat_type||''}</div></div>
      <div class="cat-icon" style="background:${CAT_COLORS[catB]||'#888'};width:40px;height:40px;border-radius:10px;font-size:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">${CAT_ABBR[catB]}</div>
    </div>
  </div>`;

  // Comparison table
  function makeCompareTable(title, defs, getA, getB) {
    const rows = defs.filter(p => getA(p.key) != null || getB(p.key) != null);
    if (rows.length === 0) return '';
    let t = `<div class="prop-section"><div class="prop-section-title">${title}</div>
      <table class="compare-table"><tr><th>Property</th><th>A</th><th>B</th><th>Diff</th></tr>`;
    rows.forEach(p => {
      const vA = getA(p.key), vB = getB(p.key);
      let diffHtml = '<td class="diff same">\u2014</td>';
      if (vA != null && vB != null && typeof vA === 'number' && typeof vB === 'number' && vA !== 0) {
        const pct = ((vB - vA) / Math.abs(vA) * 100);
        const cls = Math.abs(pct) < 0.1 ? 'same' : (pct > 0 ? 'higher' : 'lower');
        const sign = pct > 0 ? '+' : '';
        diffHtml = `<td class="diff ${cls}">${sign}${pct.toFixed(1)}%</td>`;
      }
      t += `<tr><td class="prop-name">${p.label} <span style="color:var(--text3)">(${p.unit})</span></td>
        <td class="val-a">${fmt(vA)}</td><td class="val-b">${fmt(vB)}</td>${diffHtml}</tr>`;
    });
    t += `</table></div>`;
    return t;
  }

  const mechA = mA.mechanical || {}, mechB = mB.mechanical || {};
  const thermA = mA.thermal || {}, thermB = mB.thermal || {};
  const dampA = mA.damping || {}, dampB = mB.damping || {};

  html += makeCompareTable('Mechanical Properties', MECH_DEFS, k => mechA[k], k => mechB[k]);
  html += makeCompareTable('Thermal Properties', THERM_DEFS, k => thermA[k], k => thermB[k]);

  const dampDefs = [
    { key: 'zeta', label: 'Damping Ratio \u03B6', unit: '\u2014' },
    { key: 'alpha', label: 'Mass \u03B1', unit: '1/s' },
    { key: 'beta', label: 'Stiffness \u03B2', unit: 's' },
  ];
  html += makeCompareTable('Rayleigh Damping', dampDefs, k => dampA[k], k => dampB[k]);

  html += `<div class="section-divider"></div>`;

  // Compare radar
  html += `<div class="prop-section"><div class="prop-section-title">Radar Comparison</div>
    <div class="radar-wrap"><canvas id="chartRadarCmp" width="400" height="400"></canvas></div></div>`;

  html += `<div class="section-divider"></div>`;

  // Cards side by side
  html += `<div class="prop-section"><div class="prop-section-title">LS-DYNA Cards</div></div>`;
  html += `<div class="compare-layout">
    <div class="compare-col">

function buildCompareRadar(mA, mB) {
  const el = document.getElementById('chartRadarCmp');
  if (!el) return;
  const allDefs = [...MECH_DEFS.map(d => ({...d, get: m => m.mechanical?.[d.key]})),
                   ...THERM_DEFS.map(d => ({...d, get: m => m.thermal?.[d.key]}))];
  const axes = allDefs.filter(a => a.get(mA) != null || a.get(mB) != null);
  if (axes.length < 3) return;

  const maxVals = axes.map(a => {
    const vals = allMaterials.map(m => a.get(m)).filter(v => v != null && v > 0);
    return vals.length ? Math.max(...vals) : 1;
  });
  const normA = axes.map((a, i) => { const v = a.get(mA); return v != null && maxVals[i] > 0 ? v / maxVals[i] : 0; });
  const normB = axes.map((a, i) => { const v = a.get(mB); return v != null && maxVals[i] > 0 ? v / maxVals[i] : 0; });

  const chart = new Chart(el, {
    type: 'radar',
    data: {
      labels: axes.map(a => a.label),
      datasets: [
        { label: mA.name, data: normA, borderColor: '#6c8cff', backgroundColor: 'rgba(108,140,255,0.12)', borderWidth: 2, pointBackgroundColor: '#6c8cff', pointRadius: 3 },
        { label: mB.name, data: normB, borderColor: '#fb923c', backgroundColor: 'rgba(251,146,60,0.12)', borderWidth: 2, pointBackgroundColor: '#fb923c', pointRadius: 3 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      plugins: { legend: { labels: { color: '#8891aa', font: { size: 11 }, usePointStyle: true } } },
      scales: {
        r: { angleLines: { color: '#272d4060' }, grid: { color: '#272d4060' },
             pointLabels: { color: '#e8ebf4', font: { size: 11, weight: '500' } },
             ticks: { display: false }, suggestedMin: 0, suggestedMax: 1 }
      }
    }
  });
  chartInstances.push(chart);
}

// ══════════════════════════════════════════════════════════════
//  Charts (single material)
// ══════════════════════════════════════════════════════════════
function buildAllCharts(m) {
  const peers = allMaterials.filter(p => p.category === m.category);
  const mech = m.mechanical || {};
  const damp = m.damping || {};
  const parsedCard = parseCardParams(m);

  buildRadarChart('chartRadar', m, peers);
  buildBarChart('chartE', peers, m.mid, p => p.mechanical?.E_GPa, 'GPa', '#5b8af5');
  buildBarChart('chartRho', peers, m.mid, p => p.mechanical?.rho_g_cm3, 'g/cm\u00b3', '#4ade80');
  buildBarChart('chartCTE', peers, m.mid, p => p.thermal?.ALPHA_ppm_K, 'ppm/K', '#fb923c');
  buildBarChart('chartTC', peers, m.mid, p => p.thermal?.k_SI, 'W/(m\u00b7K)', '#22d3ee');

  // Viscoelastic: G(t), DMA, tan(delta)
  if (mech.G0 && mech.GI != null && mech.BETA) {
    const G_inf = mech.G0;
    const G1 = mech.GI - mech.G0;  // GI = instantaneous, G0 = long-term
    buildRelaxChart('chartVE', G_inf, G1, mech.BETA);
    buildDMAChart('chartDMA', G_inf, G1, mech.BETA);
    buildTanDeltaChart('chartTanD', G_inf, G1, mech.BETA);
  }

  // Elastoplastic: stress-strain, loading/unloading, strain rate
  const sigy = mech.SIGY || parsedCard.SIGY;
  const E = mech.E || parsedCard.E;
  const etan = parsedCard.ETAN || 0;
  if (E && sigy) {
    const failStrain = parsedCard.FAIL || 0;
    buildStressStrainChart('chartSS', E, sigy, etan, failStrain);
    buildLoadUnloadChart('chartLU', E, sigy, etan);
    if (parsedCard.C && parsedCard.P) {
      buildStrainRateChart('chartSR', sigy, parsedCard.C, parsedCard.P);
    }
  }

  // Mooney-Rivlin
  if (mech.A && mech.B) {
    buildMooneyRivlinChart('chartMR', mech.A, mech.B);
  }

  // Rayleigh damping
  if (damp.alpha && damp.beta) buildDampingChart('chartDamp', damp.alpha, damp.beta);
}

  const axes = [
    { key:'E', label:'Stiffness', val:mech.E_GPa, get:p=>p.mechanical?.E_GPa },

    { key:'PR', label:"Poisson's", val:mech.PR, get:p=>p.mechanical?.PR },
    { key:'SIGY', label:'Strength', val:mech.SIGY, get:p=>p.mechanical?.SIGY },
    { key:'k', label:'Conductivity', val:therm.k_SI, get:p=>p.thermal?.k_SI },

// ══════════════════════════════════════════════════════════════
//  Card text parser — extract ETAN, C, P from LS-DYNA card
// ══════════════════════════════════════════════════════════════
function parseCardParams(m) {
  const result = { E: 0, SIGY: 0, ETAN: 0, C: 0, P: 0, FAIL: 0 };
  const cards = m.cards_structural || {};
  // Try MAT_024 first, then MAT_003
  const cardText = cards['MAT_PIECEWISE_LINEAR_PLASTICITY'] || cards['MAT_PLASTIC_KINEMATIC'] || '';
  if (!cardText) return result;
  const lines = cardText.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith('$') || line.startsWith('*') || !line.trim()) continue;
    // Parse 10-char fixed fields
    const fields = [];
    for (let j = 0; j < line.length; j += 10) fields.push(parseFloat(line.substring(j, j + 10)) || 0);
    // Check previous comment line for field names
    const prev = (i > 0) ? lines[i - 1].trim() : '';
    if (prev.includes('SIGY') && prev.includes('ETAN')) {
      // Card 1 data: MID RO E PR SIGY ETAN FAIL TDEL
      if (fields.length >= 6) {
        result.E = fields[2];
        result.SIGY = fields[4];
        result.ETAN = fields[5];
        if (fields.length >= 7) result.FAIL = fields[6];
      }
    } else if (prev.includes('LCSS') && (prev.includes('  C ') || prev.includes('  P '))) {
      // Card 2: C P LCSS LCSR VP
      if (fields.length >= 2) {
        result.C = fields[0];
        result.P = fields[1];
      }
    } else if (prev.includes('SRC') && prev.includes('SRP')) {
      // MAT_003 Card 2: SRC SRP FS VP
      if (fields.length >= 2) {
        result.C = fields[0];
        result.P = fields[1];
      }
    }
  }
  return result;
}

// DMA: Storage G'(w), Loss G''(w) for single-term Prony viscoelastic
function buildDMAChart(canvasId, G_inf, G1, beta) {
  const el = document.getElementById(canvasId); if (!el) return;
  const N = 200, fMin = 0.1, fMax = 100000;
  const labels = [], storageData = [], lossData = [];
  for (let i = 0; i <= N; i++) {
    const logf = Math.log10(fMin) + (i / N) * (Math.log10(fMax) - Math.log10(fMin));
    const f = Math.pow(10, logf);
    const omega = 2 * Math.PI * f;
    const Gp = G_inf + G1 * (beta * omega) * (beta * omega) / (beta * beta + omega * omega);
    const Gpp = G1 * beta * omega / (beta * beta + omega * omega);
    labels.push(f >= 1000 ? (f/1000).toFixed(0)+'k' : f >= 1 ? f.toFixed(0) : f.toFixed(1));
    storageData.push(Gp);
    lossData.push(Gpp);
  }
  const chart = new Chart(el, {
    type: 'line',
    data: { labels, datasets: [
      { label: "G' Storage", data: storageData, borderColor: '#6c8cff', backgroundColor: 'rgba(108,140,255,0.06)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 },
      { label: "G'' Loss", data: lossData, borderColor: '#f87171', backgroundColor: 'rgba(248,113,113,0.06)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 },
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#8891aa', font: { size: 11 }, usePointStyle: true } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(4)} MPa` } } },
      scales: {
        x: { title: { display: true, text: 'Frequency (Hz) \u2014 log scale', color: '#8891aa', font: { size: 11 } },
             grid: { color: '#272d4030' }, ticks: { color: '#8891aa', font: { size: 9 }, maxTicksLimit: 10 } },
        y: { title: { display: true, text: 'Modulus (MPa)', color: '#8891aa', font: { size: 11 } },
             grid: { color: '#272d4030' }, ticks: { color: '#8891aa', font: { size: 10 } } }
      }
    }
  });
  el.closest('.chart-container').style.height = '300px';
  chartInstances.push(chart);
}

// Loss factor tan(delta) vs frequency
function buildTanDeltaChart(canvasId, G_inf, G1, beta) {
  const el = document.getElementById(canvasId); if (!el) return;
  const N = 200, fMin = 0.1, fMax = 100000;
  const labels = [], tanDData = [];
  for (let i = 0; i <= N; i++) {
    const logf = Math.log10(fMin) + (i / N) * (Math.log10(fMax) - Math.log10(fMin));
    const f = Math.pow(10, logf);
    const omega = 2 * Math.PI * f;
    const Gp = G_inf + G1 * (beta * omega) ** 2 / (beta ** 2 + omega ** 2);
    const Gpp = G1 * beta * omega / (beta ** 2 + omega ** 2);
    const tanD = Gp > 0 ? Gpp / Gp : 0;
    labels.push(f >= 1000 ? (f/1000).toFixed(0)+'k' : f >= 1 ? f.toFixed(0) : f.toFixed(1));
    tanDData.push(tanD);
  }
  const chart = new Chart(el, {
    type: 'line',
    data: { labels, datasets: [
      { label: 'tan(\u03B4)', data: tanDData, borderColor: '#fbbf24', backgroundColor: 'rgba(251,191,36,0.06)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 },
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` tan(\u03B4) = ${ctx.parsed.y.toFixed(5)}` } } },
      scales: {
        x: { title: { display: true, text: 'Frequency (Hz) \u2014 log scale', color: '#8891aa', font: { size: 11 } },
             grid: { color: '#272d4030' }, ticks: { color: '#8891aa', font: { size: 9 }, maxTicksLimit: 10 } },
        y: { title: { display: true, text: 'tan(\u03B4)', color: '#8891aa', font: { size: 11 } },
             grid: { color: '#272d4030' }, ticks: { color: '#8891aa', font: { size: 10 } } }
      }
    }
  });
  el.closest('.chart-container').style.height = '280px';
  chartInstances.push(chart);
}

// Stress-strain bilinear curve
function buildStressStrainChart(canvasId, E, sigy, etan, failStrain) {
  const el = document.getElementById(canvasId); if (!el) return;
  const epsY = sigy / E;
  const epsMax = failStrain > epsY ? failStrain : epsY * 10;
  const N = 100;
  const labels = [], stress = [];
  for (let i = 0; i <= N; i++) {
    const eps = (i / N) * epsMax;
    labels.push((eps * 100).toFixed(2));
    if (eps <= epsY) stress.push(E * eps);
    else stress.push(sigy + etan * (eps - epsY));
  }
  const chart = new Chart(el, {
    type: 'line',
    data: { labels, datasets: [
      { label: '\u03C3 (MPa)', data: stress, borderColor: '#6c8cff', backgroundColor: 'rgba(108,140,255,0.06)', fill: true, tension: 0, pointRadius: 0, borderWidth: 2 },
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` \u03C3 = ${ctx.parsed.y.toFixed(1)} MPa at \u03B5 = ${ctx.label}%` } } },
      scales: {
        x: { title: { display: true, text: 'Strain \u03B5 (%)', color: '#8891aa', font: { size: 11 } },
             grid: { color: '#272d4030' }, ticks: { color: '#8891aa', font: { size: 9 }, maxTicksLimit: 10 } },
        y: { title: { display: true, text: 'Stress \u03C3 (MPa)', color: '#8891aa', font: { size: 11 } },
             grid: { color: '#272d4030' }, ticks: { color: '#8891aa', font: { size: 10 } },
             beginAtZero: true }
      }
    }
  });
  el.closest('.chart-container').style.height = '300px';
  chartInstances.push(chart);
}

// Loading-unloading cycle (isotropic hardening)
function buildLoadUnloadChart(canvasId, E, sigy, etan) {
  const el = document.getElementById(canvasId); if (!el) return;
  const epsY = sigy / E;
  const epsMax = epsY * 5;
  const points = [];
  // Loading: 0 → epsMax
  const N = 60;
  for (let i = 0; i <= N; i++) {
    const eps = (i / N) * epsMax;
    const sig = eps <= epsY ? E * eps : sigy + etan * (eps - epsY);
    points.push({ x: eps * 100, y: sig });
  }
  // Unloading: epsMax → residual
  const sigMax = sigy + etan * (epsMax - epsY);
  const epsResidual = epsMax - sigMax / E;
  for (let i = 0; i <= N / 2; i++) {
    const frac = i / (N / 2);
    const sig = sigMax * (1 - frac);
    const eps = epsMax - (sigMax - sig) / E;
    points.push({ x: eps * 100, y: sig });
  }
  // Reverse loading into compression (partial)
  const sigYield2 = sigy + etan * (epsMax - epsY); // isotropic: yield surface expands
  for (let i = 0; i <= N / 3; i++) {
    const frac = i / (N / 3);
    const sig = -sigYield2 * frac * 0.3;
    const eps = epsResidual + sig / E;
    points.push({ x: eps * 100, y: sig });
  }

  const chart = new Chart(el, {
    type: 'scatter',
    data: { datasets: [
      { label: 'Loading/Unloading', data: points, borderColor: '#a78bfa', backgroundColor: 'rgba(167,139,250,0.06)',
        showLine: true, fill: false, tension: 0, pointRadius: 0, borderWidth: 2 },
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` \u03C3=${ctx.parsed.y.toFixed(1)} MPa, \u03B5=${ctx.parsed.x.toFixed(3)}%` } } },
      scales: {
        x: { title: { display: true, text: 'Strain \u03B5 (%)', color: '#8891aa', font: { size: 11 } },
             grid: { color: '#272d4030' }, ticks: { color: '#8891aa', font: { size: 9 } } },
        y: { title: { display: true, text: 'Stress \u03C3 (MPa)', color: '#8891aa', font: { size: 11 } },
             grid: { color: '#272d4030' }, ticks: { color: '#8891aa', font: { size: 10 } } }
      }
    }
  });
  el.closest('.chart-container').style.height = '300px';
  chartInstances.push(chart);
}

// Cowper-Symonds strain rate effect on yield stress
function buildStrainRateChart(canvasId, sigy, C, P) {
  const el = document.getElementById(canvasId); if (!el) return;
  const rates = [1e-4, 1e-3, 1e-2, 0.1, 1, 10, 100, 1000, 5000];
  const labels = rates.map(r => r >= 1 ? r.toFixed(0) : r.toExponential(0));
  const dynYield = rates.map(r => sigy * (1 + Math.pow(r / C, 1 / P)));

  const chart = new Chart(el, {
    type: 'line',
    data: { labels, datasets: [
      { label: 'Dynamic \u03C3y', data: dynYield, borderColor: '#fb923c', backgroundColor: 'rgba(251,146,60,0.06)', fill: true, tension: 0.3, pointRadius: 4, pointBackgroundColor: '#fb923c', borderWidth: 2 },
      { label: 'Static \u03C3y', data: rates.map(() => sigy), borderColor: '#6c8cff60', borderDash: [6, 4], fill: false, tension: 0, pointRadius: 0, borderWidth: 1 },
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#8891aa', font: { size: 11 }, usePointStyle: true } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)} MPa` } } },
      scales: {
        x: { title: { display: true, text: 'Strain Rate (1/s) \u2014 log scale', color: '#8891aa', font: { size: 11 } },
             grid: { color: '#272d4030' }, ticks: { color: '#8891aa', font: { size: 9 } } },
        y: { title: { display: true, text: 'Yield Stress (MPa)', color: '#8891aa', font: { size: 11 } },
             grid: { color: '#272d4030' }, ticks: { color: '#8891aa', font: { size: 10 } },
             beginAtZero: false }
      }
    }
  });
  el.closest('.chart-container').style.height = '280px';
  chartInstances.push(chart);
}

// Mooney-Rivlin uniaxial tension stress-stretch
function buildMooneyRivlinChart(canvasId, A, B) {
  const el = document.getElementById(canvasId); if (!el) return;
  const N = 100, lambdaMax = 3.0;
  const labels = [], stressData = [];
  for (let i = 1; i <= N; i++) {
    const lam = 1 + (i / N) * (lambdaMax - 1);
    // Cauchy stress for uniaxial: sigma = 2*(A + B/lam)*(lam - 1/lam^2)
    const sig = 2 * (A + B / lam) * (lam - 1 / (lam * lam));
    labels.push(lam.toFixed(2));
    stressData.push(sig);
  }
  const chart = new Chart(el, {
    type: 'line',
    data: { labels, datasets: [
      { label: '\u03C3 (MPa)', data: stressData, borderColor: '#34d399', backgroundColor: 'rgba(52,211,153,0.06)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 },
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` \u03C3 = ${ctx.parsed.y.toFixed(4)} MPa at \u03BB = ${ctx.label}` } } },
      scales: {
        x: { title: { display: true, text: 'Stretch Ratio \u03BB', color: '#8891aa', font: { size: 11 } },
             grid: { color: '#272d4030' }, ticks: { color: '#8891aa', font: { size: 9 }, maxTicksLimit: 10 } },
        y: { title: { display: true, text: 'Cauchy Stress \u03C3 (MPa)', color: '#8891aa', font: { size: 11 } },
             grid: { color: '#272d4030' }, ticks: { color: '#8891aa', font: { size: 10 } },
             beginAtZero: true }
      }
    }
  });
  el.closest('.chart-container').style.height = '300px';
  chartInstances.push(chart);
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') { if (e.key==='Escape') e.target.blur(); return; }
  if (e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='j'||e.key==='k') {
    e.preventDefault(); if(!filtered.length)return;
    const idx = filtered.findIndex(m=>m.mid===selectedMid);
    const dir = (e.key==='ArrowDown'||e.key==='j')?1:-1;
    selectMaterial(filtered[Math.max(0,Math.min(filtered.length-1,idx+dir))].mid);
  }
  if (e.key==='/'&&!e.ctrlKey&&!e.metaKey) { e.preventDefault(); document.getElementById('search').focus(); }
  if (e.key==='Escape'&&compareMode) exitCompare();
  if (e.key==='c'&&!e.ctrlKey&&!e.metaKey) toggleCompareMode();
});
</script>
