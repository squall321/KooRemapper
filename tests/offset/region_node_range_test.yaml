# Test: Node ID Range Region Selection
# Only offset elements that have nodes in specified ID range

base_model: ../../examples/arc30/arc30_flat.k
output: region_node_range_result

operations:
  - type: offset
    source_pid: 1
    # Region selection: node ID range
    node_id_min: 1
    node_id_max: 100
    # Offset parameters
    thickness: 1.0
    num_layers: 1
    element_type: solid
    offset_direction: +z
    use_local_normals: true
    connection_mode: tied
    new_pid: 10
    part_title: "NodeRange_Region"
    material_card: |
      *MAT_ELASTIC
      $#     mid        ro         e        pr
           @MID@       2.0     12000       0.25
