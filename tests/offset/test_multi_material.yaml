# Test: Multi-material layers in single offset operation
# Purpose: Verify layer-by-layer different materials

base_model: ../../examples/tet10/two_tets.k
output: test_multi_material_result

operations:
  - type: offset
    source_pid: 1
    thickness: 3.0         # 3개 layer 총 3mm (각 1mm)
    offset_direction: +z
    connection_mode: tied
    new_pid: 10            # First layer PID (11, 12 auto-assigned)
    part_title: "MultiMaterial_Layer"
    material_cards:
      - |
        *MAT_ELASTIC
        $#     mid        ro         e        pr
             @MID@       1.0     10000       0.25
      - |
        *MAT_PLASTIC_KINEMATIC
        $#     mid        ro         e        pr      sigy      etan
             @MID@       2.0     15000       0.28       300         0
      - |
        *MAT_ELASTIC
        $#     mid        ro         e        pr
             @MID@       1.5     12000       0.30
