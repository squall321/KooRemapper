# Regression Test 1: Basic solid offset with tied connection
# Expected: 600 source faces → 600 HEX8 offset elements
base_model: ../../../examples/arc30/arc30_flat.k
output: 01_solid_tied

operations:
  - type: offset
    source_pid: 1
    thickness: 1.0
    num_layers: 1
    element_type: solid
    offset_direction: +z
    connection_mode: tied
    new_pid: 10
    part_title: "Regression_Solid_Tied"
    material_card: |
      *MAT_ELASTIC
      $#     mid        ro         e        pr
           @MID@       2.0     12000       0.25
