# Test: Variable Thickness with Formula
# Thickness varies based on position

base_model: ../../examples/arc30/arc30_flat.k
output: variable_thickness_result

operations:
  - type: offset
    source_pid: 1
    # Variable thickness formula: linear variation with x
    thickness: 1.0  # Base thickness (fallback)
    thickness_formula: 1.0 + 0.01*x  # Simple linear
    num_layers: 1
    element_type: solid
    offset_direction: +z
    connection_mode: tied
    new_pid: 10
    part_title: "Variable_Thickness"
    material_card: |
      *MAT_ELASTIC
      $#     mid        ro         e        pr
           @MID@       2.0     12000       0.25
