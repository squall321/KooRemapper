# Test: Single layer with local normals
# Compare output quality with local_normal_test.yaml vs basic +normal

base_model: ../../examples/arc30/arc30_flat.k
output: local_normal_single

operations:
  - type: offset
    source_pid: 1
    thickness: 1.0
    num_layers: 1
    element_type: solid
    offset_direction: +normal
    use_local_normals: true
    connection_mode: tied
    new_pid: 10
    part_title: "LocalNormal"
    material_card: |
      *MAT_ELASTIC
      $#     mid        ro         e        pr
           @MID@       2.0     12000       0.25
