# Test: Local Normal Option
# Curved surface with local normals for better quality

base_model: ../../examples/arc30/arc30_flat.k
output: local_normal_result

operations:
  - type: offset
    source_pid: 1
    thickness: 1.0
    num_layers: 1
    element_type: solid
    offset_direction: +normal
    use_local_normals: true  # Enable local normal mode
    connection_mode: tied
    new_pid: 10
    part_title: "Local_Normal_Test"
    material_card: |
      *MAT_ELASTIC
      $#     mid        ro         e        pr
           @MID@       2.0     12000       0.25
