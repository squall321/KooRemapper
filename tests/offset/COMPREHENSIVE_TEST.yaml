# Comprehensive Integration Test - ALL NEW FEATURES
# Tests: Local Normals + Region Selection + Variable Thickness

base_model: ../../examples/arc30/arc30_flat.k
output: comprehensive_test_result

operations:
  # Test ALL features together
  - type: offset
    source_pid: 1

    # FEATURE 2: Local Normals (per-node averaging)
    use_local_normals: true

    # FEATURE 3: Region Selection (center region only)
    bbox_xmin: -8.0
    bbox_xmax: 8.0
    bbox_ymin: -15.0
    bbox_ymax: 15.0

    # FEATURE 4: Variable Thickness (formula-based)
    thickness: 1.0
    thickness_formula: 1.0 + 0.02*x

    # Standard params
    num_layers: 1
    element_type: solid
    offset_direction: +normal
    connection_mode: tied
    new_pid: 10
    part_title: "Comprehensive_Test"

    material_card: |
      *MAT_ELASTIC
      $#     mid        ro         e        pr
           @MID@       2.0     12000       0.25
