# KooRemapper Platform — nginx reverse proxy + TLS
#
# Topology (all upstreams on loopback inside the host/net namespace):
#   API  (serves the SPA + /api/) -> 127.0.0.1:8700
#   MCP  (streamable-http)         -> 127.0.0.1:8701
#
# Listens:
#   8443  https  (self-signed certs at /etc/nginx/certs/)
#   8089  http   (redirect everything to https)

user  nginx;
worker_processes  auto;
# Logs go to the container's stdout/stderr (apptainer captures them); the image
# rootfs is read-only, so /var/log/nginx is not writable.
error_log  /dev/stderr notice;
# pid + temp paths live under /tmp (apptainer mounts it writable) so nginx runs
# from the read-only image without needing --writable-tmpfs.
pid        /tmp/nginx/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # Writable scratch paths under /tmp (read-only image rootfs otherwise).
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    gzip on;
    # The SPA assets are proxied from the API, so gzip the upstream responses too
    # (default gzip_proxied is off → proxied content would pass through uncompressed).
    gzip_proxied any;
    gzip_vary on;
    # Note: include text/javascript — Python 3.12's mimetypes (the API's static
    # server) labels .js as text/javascript, not application/javascript.
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;

    sendfile        on;
    keepalive_timeout  65;

    # Allow large mesh/result uploads through the proxy (0 = unlimited).
    client_max_body_size 0;

    # Map Upgrade header so the MCP streamable-http connection can be upgraded
    # when needed; "" Connection when no upgrade requested (keep-alive intact).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream koorm_api {
        server 127.0.0.1:8700;
    }
    upstream koorm_mcp {
        server 127.0.0.1:8701;
    }

    # ── Shared proxy headers (forwarded identity + original scheme/host) ──
    # Re-applied per location since proxy_set_header at server scope is
    # discarded once a location sets any of its own.

    # ── 8089: plain HTTP → permanent redirect to HTTPS ──────────────────
    server {
        listen      8089;
        listen      [::]:8089;
        server_name _;

        # Preserve original host (minus :8089) when bouncing to 8443.
        return 301 https://$host:8443$request_uri;
    }

    # ── 8443: HTTPS (self-signed) ───────────────────────────────────────
    server {
        listen      8443 ssl;
        listen      [::]:8443 ssl;
        http2       on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Upstream-down → consistent JSON envelope (matches the API) ──
        error_page 502 503 504 = @upstream_down;
        location @upstream_down {
            default_type application/json;
            return 503 '{"success":false,"data":null,"message":"서비스를 일시적으로 사용할 수 없습니다.","errors":[{"code":"upstream_unavailable"}]}';
        }

        # ── /api/ → API ────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://koorm_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
        }

        # ── /mcp (and /mcp/) → MCP (streamable-http) ───────────────────
        # Streaming endpoint: buffering OFF and a long read timeout so the
        # server can hold the response open and push chunks as they arrive.
        location /mcp {
            proxy_pass http://koorm_mcp;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:8701;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            proxy_buffering    off;        # don't accumulate the SSE/stream
            proxy_cache        off;
            proxy_read_timeout 3600s;      # keep long-lived streams open
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # ── / and SPA assets → API (the API serves the built SPA) ───────
        location / {
            proxy_pass http://koorm_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
        }
    }
}
