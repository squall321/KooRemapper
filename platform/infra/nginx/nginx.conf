# KooRemapper Platform — nginx reverse proxy + TLS
#
# Topology (all upstreams on loopback inside the host/net namespace):
#   API  (serves the SPA + /api/) -> 127.0.0.1:8700
#   MCP  (streamable-http)         -> 127.0.0.1:8701
#
# Listens:
#   8443  https  (self-signed certs at /etc/nginx/certs/)
#   8080  http   (redirect everything to https)

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Allow large mesh/result uploads through the proxy (0 = unlimited).
    client_max_body_size 0;

    # Map Upgrade header so the MCP streamable-http connection can be upgraded
    # when needed; "" Connection when no upgrade requested (keep-alive intact).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream koorm_api {
        server 127.0.0.1:8700;
    }
    upstream koorm_mcp {
        server 127.0.0.1:8701;
    }

    # ── Shared proxy headers (forwarded identity + original scheme/host) ──
    # Re-applied per location since proxy_set_header at server scope is
    # discarded once a location sets any of its own.

    # ── 8080: plain HTTP → permanent redirect to HTTPS ──────────────────
    server {
        listen      8089;
        listen      [::]:8089;
        server_name _;

        # Preserve original host (minus :8080) when bouncing to 8443.
        return 301 https://$host:8443$request_uri;
    }

    # ── 8443: HTTPS (self-signed) ───────────────────────────────────────
    server {
        listen      8443 ssl;
        listen      [::]:8443 ssl;
        http2       on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── /api/ → API ────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://koorm_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
        }

        # ── /mcp (and /mcp/) → MCP (streamable-http) ───────────────────
        # Streaming endpoint: buffering OFF and a long read timeout so the
        # server can hold the response open and push chunks as they arrive.
        location /mcp {
            proxy_pass http://koorm_mcp;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:8701;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            proxy_buffering    off;        # don't accumulate the SSE/stream
            proxy_cache        off;
            proxy_read_timeout 3600s;      # keep long-lived streams open
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # ── / and SPA assets → API (the API serves the built SPA) ───────
        location / {
            proxy_pass http://koorm_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
        }
    }
}
