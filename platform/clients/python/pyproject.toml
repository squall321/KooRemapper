[project]
name = "kooremapper-client"
version = "0.1.0"
description = "Python client (sync + async) for the KooRemapper platform REST API"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["kooremapper*"]
